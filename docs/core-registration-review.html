<!doctype html><html><head><meta charset="utf-8"><title>Core registration review · SWR-512</title>
<style>body{margin:0;background:#101822;color:#eee;font:14px system-ui}aside{position:fixed;z-index:2;left:18px;top:14px;width:300px;background:#162330ed;padding:16px;border-radius:8px}h1{font-size:18px;margin-top:0}label{display:block;margin:12px 0}select,button{background:#253848;color:white;padding:6px;border:1px solid #678}p{color:#aebdca;line-height:1.45}#status{font-size:12px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body>
<aside><h1>Core registration review</h1><p>Source meshes fitted rigidly to nine shared bones. This is a registration candidate, not validated anatomy.</p>
<label>Core muscle <select id="muscle"><option value="all">All source core muscles</option><option value="rectus_abdominis">Rectus abdominis</option><option value="internal_oblique">Internal oblique</option><option value="transversus_abdominis">Transversus abdominis</option><option value="quadratus_lumborum">Quadratus lumborum</option><option value="multifidus">Multifidus (all regions)</option></select></label>
<label><input id="target" type="checkbox" checked> Current atlas bones (ivory)</label><label><input id="source" type="checkbox"> Registered source reference bones (blue)</label><label><input id="outer" type="checkbox"> Current external oblique (translucent grey)</label>
<label>Muscle opacity <input id="opacity" type="range" min="0.15" max="1" step="0.05" value="1"></label>
<button data-view="front">Front</button> <button data-view="back">Back</button> <button data-view="side">Side</button>
<p>Drag to orbit; scroll to zoom. Purple: rectus. Orange: internal oblique. Red: transversus. Green: quadratus. Cyan: multifidus.</p><div id="status">Loading meshes…</div></aside>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#101822');const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,20);camera.position.set(0,1.1,1.7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.12,0);controls.update();scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(1,2,3);scene.add(light);const rear=new THREE.DirectionalLight(0xffffff,2);rear.position.set(-1,1,-3);scene.add(rear);
const core=new THREE.Group(),sourceBones=new THREE.Group(),targetBones=new THREE.Group(),outer=new THREE.Group();scene.add(core,sourceBones,targetBones,outer);sourceBones.visible=false;outer.visible=false;
const[m,r,a]=await Promise.all(['/data/anatomy/z-anatomy/core-source.json','/data/anatomy/z-anatomy/registration-review.json','/models/atlas.json'].map(u=>fetch(u).then(r=>r.json())));
const binary=await fetch('/data/anatomy/z-anatomy/'+m.binary).then(r=>r.arrayBuffer());const matrix=new THREE.Matrix4().set(...r.sourceWorldToAtlasMatrix.flat());
function mesh(p,buffer,source,color,opacity){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(buffer,p.positions,p.vertexCount*3).slice(),3));g.setIndex(new THREE.BufferAttribute(new Uint32Array(buffer,p.indices,p.indexCount).slice(),1));g.computeVertexNormals();if(source)g.applyMatrix4(matrix);const material=new THREE.MeshStandardMaterial({color,roughness:.75,metalness:0,side:THREE.DoubleSide,transparent:opacity<1,opacity,depthWrite:opacity===1});return new THREE.Mesh(g,material)}
for(const p of m.parts){const colors={rectus_abdominis:0xc779d0,internal_oblique:0xdc9c58,transversus_abdominis:0xca6060,quadratus_lumborum:0x7cbe8a,multifidus:0x61bdd1};let color=0x499fe5;for(const[k,v]of Object.entries(colors))if(p.id.includes(k))color=v;const o=mesh(p,binary,true,color,p.role==='core'?1:.3);o.userData.id=p.id;(p.role==='core'?core:sourceBones).add(o)}
const selected=a.parts.filter(p=>(p.system==='skeletal'&&p.bounds[1][1]>.79&&p.bounds[0][1]<1.53)||['FJ1452','FJ1452M'].includes(p.id));const ids=[...new Set(selected.map(p=>p.chunk))];const buffers=new Map(await Promise.all(ids.map(async i=>[i,await fetch(a.chunks[i].url).then(r=>r.arrayBuffer())])));
for(const p of selected){const muscular=p.system==='muscular';(muscular?outer:targetBones).add(mesh(p,buffers.get(p.chunk),false,muscular?0x8b97a5:0xdfd7bd,muscular?.25:1))}
document.querySelector('#status').textContent=`14 source core meshes · ${targetBones.children.length} current skeletal meshes. Internal oblique has 5 source boundary edges per side.`;
document.querySelector('#muscle').onchange=e=>{for(const o of core.children)o.visible=e.target.value==='all'||o.userData.id.includes(e.target.value)};
for(const[id,group]of[['target',targetBones],['source',sourceBones],['outer',outer]])document.getElementById(id).onchange=e=>group.visible=e.target.checked;
document.querySelector('#opacity').oninput=e=>{for(const o of core.children){o.material.opacity=+e.target.value;o.material.transparent=o.material.opacity<1;o.material.depthWrite=o.material.opacity===1}};
for(const b of document.querySelectorAll('button'))b.onclick=()=>{const view=b.dataset.view;camera.position.set(view==='side'?1.7:0,1.12,view==='side'?0:view==='back'?-1.7:1.7);controls.target.set(0,1.12,0);controls.update()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
